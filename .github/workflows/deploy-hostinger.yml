name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production
        run: bun run build

      - name: Deploy to Hostinger via FTP (lftp)
        run: |
          sudo apt-get install -y lftp
          lftp -u "u883849716.mecanicopro,Enzo@159753" "ftp.mecanicopro.9ninebusinesscontrol.com.br" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 120
          set cmd:fail-exit no
          cd /home/u883849716/domains/mecanicopro.9ninebusinesscontrol.com.br/public_html/
          # Remove arquivos antigos (ignora erros se nao existirem)
          rm -f index.html
          rm -f *.js
          rm -f *.css
          rm -rf assets
          # Cria diretorio assets
          mkdir assets
          # Sobe index.html
          lcd ./dist
          put index.html
          # Sobe arquivos da raiz
          mput *.js
          mput *.css
          # Sobe assets
          lcd ./dist/assets
          cd assets
          mput *
          bye
          EOF
