name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production
          if [ -n "${{ secrets.VITE_MERCADO_PAGO_PUBLIC_KEY }}" ]; then
            echo "VITE_MERCADO_PAGO_PUBLIC_KEY=${{ secrets.VITE_MERCADO_PAGO_PUBLIC_KEY }}" >> .env.production
          fi

      - name: Validate required secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::error::VITE_SUPABASE_URL is missing"
            MISSING=1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is missing"
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            echo "::error::Add missing secrets at: GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets present."

      - name: Generate env.ts with hardcoded values
        run: |
          cat > src/lib/env.ts <<'EOF'
          export const ENV = {
            VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}",
            VITE_SUPABASE_PUBLISHABLE_KEY: "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}",
            VITE_APP_URL: "${{ secrets.VITE_APP_URL || 'https://mecanicopro.9ninebusinesscontrol.com.br' }}",
            VITE_MERCADO_PAGO_PUBLIC_KEY: "${{ secrets.VITE_MERCADO_PAGO_PUBLIC_KEY || '' }}",
          };
          EOF

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
