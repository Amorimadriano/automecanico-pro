name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production

      - name: Validate secrets
        run: |
          if grep -qE "^VITE_SUPABASE_URL=$" .env.production; then
            echo "ERROR: VITE_SUPABASE_URL is empty"
            exit 1
          fi
          if grep -qE "^VITE_SUPABASE_PUBLISHABLE_KEY=$" .env.production; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY is empty"
            exit 1
          fi

      - name: Generate env.ts with hardcoded values
        run: |
          cat > src/lib/env.ts <<'EOF'
          export const ENV = {
            VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}",
            VITE_SUPABASE_PUBLISHABLE_KEY: "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}",
            VITE_APP_URL: "${{ secrets.VITE_APP_URL || 'https://motoerp.9ninebusinesscontrol.com.br' }}",
            VITE_MERCADO_PAGO_PUBLIC_KEY: "${{ secrets.VITE_MERCADO_PAGO_PUBLIC_KEY }}",
          };
          EOF

      - name: Build production
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
