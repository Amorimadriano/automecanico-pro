name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build

      - name: Generate static index.html
        run: |
          PORT=3001 node server.js &
          SERVER_PID=$!
          sleep 5
          curl -s http://localhost:3001/ > dist/client/index.html
          kill $SERVER_PID || true

      - name: Deploy to Hostinger via FTP (lftp)
        run: |
          sudo apt-get install -y lftp
          lftp -u "u883849716.mecanicopro,Enzo@159753" "ftp.mecanicopro.9ninebusinesscontrol.com.br" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 120
          set cmd:fail-exit no
          cd /home/u883849716/domains/mecanicopro.9ninebusinesscontrol.com.br/public_html/
          # Remove arquivos antigos (ignora erros se nao existirem)
          rm -f index.html
          rm -f .htaccess
          rm -f registerSW.js
          rm -f sw.js
          rm -f manifest.json
          rm -f icon-*.svg
          rm -rf assets
          # Sobe tudo de dist/client/
          lcd ./dist/client
          put index.html
          put .htaccess
          put registerSW.js
          put sw.js
          put manifest.json
          put icon-192x192.svg
          put icon-512x512.svg
          # Sobe assets
          mkdir assets
          lcd ./dist/client/assets
          cd assets
          mput *
          bye
          EOF
