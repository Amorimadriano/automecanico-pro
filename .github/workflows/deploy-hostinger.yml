name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build

      - name: Generate static index.html
        run: |
          PORT=3001 node server.js &
          SERVER_PID=$!
          sleep 5
          HTTP_CODE=$(curl -s -o dist/client/index.html -w "%{http_code}" http://localhost:3001/)
          kill $SERVER_PID || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Server did not return 200. Got $HTTP_CODE"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "dist/client/index.html")
          echo "index.html: $FILE_SIZE bytes"

      - name: Detect FTP path
        run: |
          sudo apt-get install -y lftp
          lftp -u "u883849716.mecanicopro,Enzo@159753" "ftp.mecanicopro.9ninebusinesscontrol.com.br" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set cmd:fail-exit no
          !echo "=== Path atual ao conectar ==="
          pwd
          ls
          bye
          EOF

      - name: Deploy to Hostinger via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "u883849716.mecanicopro,Enzo@159753" "ftp.mecanicopro.9ninebusinesscontrol.com.br" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 180
          set net:max-retries 3
          set cmd:fail-exit no
          # Path do dominio adicional na Hostinger
          cd /domains/mecanicopro.9ninebusinesscontrol.com.br/public_html || cd domains/mecanicopro.9ninebusinesscontrol.com.br/public_html || true
          ls || true
          # Remove arquivos antigos
          rm -rf assets || true
          rm -f index.html .htaccess registerSW.js sw.js manifest.json icon-*.svg || true
          # Upload recursivo
          lcd ./dist/client
          mirror -R --no-perms --parallel=3 .
          bye
          EOF
